services:
  api:
    build: ./backend
    restart: unless-stopped
    env_file:
      - .env
    # Reach a Grocy port published on the Docker host (including Linux Engine).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "127.0.0.1:8088:80"
